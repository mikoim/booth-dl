[package]
name = "booth-dl"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
cbc = "0.2.1"
clap = { version = "4.6.7", features = ["derive"] }
# Pinned: 4.6.1 through 4.6.11 (and clap's main branch as of 2026-10-29) generate bash
# completion whose `case` labels don't match a hyphenated binary name like
# `booth-dl`, so nothing after the subcommand completes. Unpin once
# `bash_script_has_a_case_for_every_command` passes with a newer release.
clap_complete = "=4.6.0"
dirs = "7.0.0"
flate2 = "1.1.10"
indicatif = "0.18.6"
md-5 = "0.11.0"
pbkdf2 = "0.13.0"
rpassword = "7.5.4"
rusqlite = { version = "0.41.1", features = ["bundled"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust2 = "0.24.1"
sha1 = "0.11.0"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
ureq = "3.5.0"
zip = "9.1.3"
